name: bookverse
description: A premium Flutter book reading application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: 
  http: 

  # Firebase Authinatications
  firebase_core: 
  firebase_auth: 
  cloud_firestore: 

  # Sign in with google
  google_sign_in: 
  # Typography
  google_fonts: 

  # local storage 
  path_provider: 
  permission_handler: 
  path: 
  external_path:
  flutter_stripe: 
  cloud_functions:

  shared_preferences:

   

  
  # Images
  cached_network_image: 
  palette_generator:

  # Loading states
  shimmer: 

  # Firebase (uncomment once `flutterfire configure` has been run
  # against your own Firebase project — see README)
  # firebase_core: ^3.1.0
  # firebase_auth: ^5.1.0
  # cloud_firestore: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - asset/li.png
    - asset/book.png

  fonts:
    - family: BrittanySignature
      fonts:
        - asset: asset/Fonts/BrittanySignature.ttf

    - family: Dancing
      fonts:
        - asset: asset/Fonts/Dancig.ttf